  <body>
    <!--
      THESIS: a Íris é o HUD do Mark III, não o do Mark II. Recusa a coluna
      centralizada de balõezinhos que todo app de IA entrega, e recusa também
      o clichê cyan-com-brilho — que é justamente o HUD que os designers do
      filme abandonaram ("cyan is passé", Wesley Sewell) ao trocá-lo por
      branco com cor só de acento.

      OWN-WORLD: vidro escuro de viés azul em três profundidades (#05090E
      fundo, #0B1219 chapa, #03070A sulco). O TRAÇO é branco frio (#EAF2F6);
      âmbar #E8A33D é acento crítico e marca; cyan #5BC8E8 é dado secundário,
      nunca fundo nem brilho. Fio de cabelo em branco transparente, moldura em
      colchete de canto (mira, não card). Bahnschrift condensada nos rótulos,
      Cascadia no dado, Segoe na prosa. Nada tem raio de canto, nada brilha.
      Regra de corte do set: se não faz algo real, sai.

      STORY: o Pablo chama pelo Ctrl+Space, lê numa linha o que a Íris já sabe
      (janela em foco, estado, cota), pergunta, e recebe uma resposta que se
      parece com documentação da máquina dele.

      FIRST VIEWPORT: barra de status no topo — ÍRIS, o anunciador de foco ao
      vivo, a escada segmentada de cota, o estado. Corpo em calha suspensa:
      rótulo versalete monoespaçado à esquerda, conteúdo pendurado à direita.
      Vazio, o corpo é a abertura do manual (NOME/SINOPSE/DESCRIÇÃO/ATALHOS).
      Prompt ancorado embaixo, na mesma calha.

      FORM: direção repinada pelo usuário (Jarvis dos filmes), sobrepondo o
      candidato 3 sorteado na chave b36c5074. A calha suspensa sobreviveu da
      direção anterior; o material, a paleta e o movimento foram trocados.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
